[package]
name = "tread_trace_rust"
version = "0.1.0"
edition = "2021"
authors = ["Manex RE Engineering Team"]
description = "High-performance, zero-cost Rust replacement engine for Tread Trace 26 Cam V15"

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"

# Low-level Win32 Socket Control for TCP Keep-Alive
socket2 = { version = "0.5", features = ["all"] }

# Native Windows ODBC Driver Binding (Exact 1-to-1 match for pyodbc)
odbc-api = "29.0.0"

# SQLite Local Audit Database (Statically bundled)
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# Embedded High-Performance Web Server & WebSockets
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Data Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration Parsers
ini = "1.3"
dotenvy = "0.15"

# Time & Utilities
chrono = { version = "0.4", features = ["serde"] }

